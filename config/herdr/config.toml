onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[ui.toast]
delivery = "herdr"

# Prefix-free pane navigation (prefix+hjkl kept as fallback).
# https://herdr.dev/docs/keyboard/#going-prefix-free
[keys]
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
