# Autologin on tty1 (no password). Install as root:
#   sudo install -Dm644 arch/system/getty-autologin.conf \
#     /etc/systemd/system/getty@tty1.service.d/autologin.conf
# zsh-linux/.zprofile then starts Hyprland on tty1.
# Note: the disk is not encrypted, so this gives anyone with the laptop full access.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin vbsec %I $TERM
