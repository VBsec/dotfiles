onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[ui.toast]
delivery = "herdr"

# Prefix-free pane navigation (prefix+hjkl kept as fallback).
# https://herdr.dev/docs/keyboard/#going-prefix-free
[keys]
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
switch_tab = ["prefix+1..9", "ctrl+1..9"]
switch_workspace = ["prefix+shift+1..9", "ctrl+shift+1..9"]
focus_agent = ["prefix+alt+1..9", "cmd+1..9"]

# reviewr (persiyanov/herdr-reviewr): toggle the diff-review pane beside the agent.
# cmd+ chords reach herdr; alt+ is composed into characters by macOS.
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id>

[ui.sound]
enabled = false
