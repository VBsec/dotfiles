# Do nothing when the laptop lid closes (battery is dead; used plugged in with an
# external monitor). Install as root, then reload logind (safe, keeps the session):
#   sudo install -Dm644 arch/system/logind-lid.conf /etc/systemd/logind.conf.d/lid.conf
#   sudo systemctl kill -s HUP systemd-logind
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
